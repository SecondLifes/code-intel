<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code-Intel</title>
<style>
:root{--bg:#0b0e14;--panel:#131722;--card:#1a1f2e;--line:#252b3b;--txt:#e6e9f0;--dim:#8b93a7;--acc:#5b8cff;--acc2:#22c58b;--warn:#f2b544;--err:#ef5b6b;--mono:'Cascadia Code',Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 'Segoe UI',system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;font-weight:600;letter-spacing:.3px}
header h1 b{color:var(--acc)}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--acc2);border-color:#1b4536}
.pill.bad{color:var(--err);border-color:#552731}
.sp{flex:1}
.lang{cursor:pointer;user-select:none;font-size:13px;color:var(--dim)}
.lang b{color:var(--txt)}
main{max-width:1060px;margin:0 auto;padding:26px 20px 80px}
.searchbox{display:flex;gap:10px;margin-bottom:8px}
.searchbox input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;color:var(--txt);font-size:16px;outline:none}
.searchbox input:focus{border-color:var(--acc)}
button{background:var(--acc);border:0;border-radius:12px;color:#fff;padding:0 22px;font-size:15px;cursor:pointer;font-weight:600}
button.ghost{background:var(--card);border:1px solid var(--line);color:var(--dim);font-weight:400}
button:disabled{opacity:.5;cursor:wait}
.hint{color:var(--dim);font-size:12.5px;margin:0 4px 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .name{font-family:var(--mono);font-size:14.5px;color:var(--acc);font-weight:600}
.card .meta{color:var(--dim);font-size:12.5px}
.card .score{margin-left:auto;font-size:12px;color:var(--acc2)}
pre{background:#0d1117;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0 8px;overflow-x:auto;font:12.5px/1.5 var(--mono);color:#c9d1d9;max-height:260px}
.tr-box{background:#10241c;border:1px solid #1b4536;border-radius:10px;padding:11px 14px;font-size:13.5px;margin-top:8px;white-space:pre-wrap}
.tr-box.deep{background:#241a10;border-color:#4d3a1b}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{padding:6px 14px;font-size:13px;border-radius:9px}
.jobbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:22px;display:none}
.jobbar.show{display:block}
.bar{height:9px;background:#0d1117;border-radius:99px;overflow:hidden;margin:9px 0 6px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0%;transition:width .5s}
.jobmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim)}
.empty{text-align:center;color:var(--dim);padding:60px 0;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--dim);border-top-color:var(--acc);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>⚡ Code-<b>Intel</b></h1>
  <span id="p-qdrant" class="pill">Qdrant</span>
  <span id="p-ollama" class="pill">Ollama</span>
  <span id="p-gpu" class="pill">GPU</span>
  <span id="p-points" class="pill"></span>
  <div class="sp"></div>
  <button class="ghost" id="btn-index" onclick="startIndex()" data-tr="Yeniden İndeksle" data-en="Re-index">Yeniden İndeksle</button>
  <span class="lang" onclick="toggleLang()"><b id="lang-now">TR</b> / <span id="lang-alt">EN</span></span>
</header>
<main>
  <div class="jobbar" id="jobbar">
    <div style="font-size:13.5px" id="jobtitle">İndeksleniyor…</div>
    <div class="bar"><div id="jobfill"></div></div>
    <div class="jobmeta"><span id="jobnums">0 / 0</span><span id="jobrate"></span><span id="jobeta"></span></div>
  </div>
  <div class="searchbox">
    <input id="q" placeholder="Kod tabanında ara — Türkçe veya İngilizce… (örn: bağlantı havuzu nasıl yönetiliyor)" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()" id="btn-search" data-tr="Ara" data-en="Search">Ara</button>
  </div>
  <div class="hint" data-tr="25.201 UniDAC metodu ve tip bildirimi üzerinde anlamsal arama · ⚡ hızlı açıklama: gemma4 · 🔬 derin: qwen3.6" data-en="Semantic search over 25,201 UniDAC methods & types · ⚡ fast explain: gemma4 · 🔬 deep: qwen3.6">25.201 UniDAC metodu ve tip bildirimi üzerinde anlamsal arama · ⚡ hızlı açıklama: gemma4 · 🔬 derin: qwen3.6</div>
  <div id="results"><div class="empty" data-tr="Aramak için bir soru yazın — kod, Türkçe soruyu anlar 🙂" data-en="Type a question — the code understands you 🙂">Aramak için bir soru yazın — kod, Türkçe soruyu anlar 🙂</div></div>
</main>
<script>
let LANG = localStorage.getItem('ci-lang') || 'tr';
const T = (tr,en) => LANG==='tr'?tr:en;
function applyLang(){
  document.querySelectorAll('[data-tr]').forEach(el=>{ el.textContent = el.dataset[LANG==='tr'?'tr':'en']; });
  document.getElementById('lang-now').textContent = LANG.toUpperCase();
  document.getElementById('lang-alt').textContent = LANG==='tr'?'EN':'TR';
  document.getElementById('q').placeholder = T('Kod tabanında ara — Türkçe veya İngilizce… (örn: bağlantı havuzu nasıl yönetiliyor)','Search the codebase — Turkish or English… (e.g. how is connection pooling managed)');
}
function toggleLang(){ LANG = LANG==='tr'?'en':'tr'; localStorage.setItem('ci-lang',LANG); applyLang(); }
applyLang();

async function health(){
  try{
    const h = await (await fetch('/api/health')).json();
    setPill('p-qdrant', h.qdrant, 'Qdrant'); setPill('p-ollama', h.ollama, 'Ollama'); setPill('p-gpu', h.gpu, 'GPU');
    const pts = (h.collections||[]).reduce((a,c)=>a+c.points,0);
    document.getElementById('p-points').textContent = pts.toLocaleString('tr') + ' ' + T('nokta','points');
  }catch(e){}
}
function setPill(id, ok, label){ const el=document.getElementById(id); el.className='pill '+(ok?'ok':'bad'); el.textContent=(ok?'● ':'○ ')+label; }
health(); setInterval(health, 10000);

async function doSearch(){
  const q = document.getElementById('q').value.trim(); if(!q) return;
  const btn=document.getElementById('btn-search'); btn.disabled=true;
  document.getElementById('results').innerHTML = '<div class="empty"><span class="spin"></span>'+T('Aranıyor…','Searching…')+'</div>';
  try{
    const r = await (await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})})).json();
    render(r);
  }catch(e){ document.getElementById('results').innerHTML='<div class="empty">⚠️ '+e+'</div>'; }
  btn.disabled=false;
}
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function render(r){
  if(!r.hits || !r.hits.length){ document.getElementById('results').innerHTML='<div class="empty">'+T('Sonuç yok','No results')+'</div>'; return; }
  document.getElementById('results').innerHTML =
    `<div class="hint">${r.hits.length} ${T('sonuç','results')} · ${r.ms} ms</div>` +
    r.hits.map(h=>`
    <div class="card" id="c${h.id}">
      <div class="top">
        <span class="name">${esc(h.name)}</span>
        <span class="meta">${esc(h.unit)} · L${h.line_start}-${h.line_end} · ${esc(h.kind)}</span>
        <span class="score">${h.score}</span>
      </div>
      <pre>${esc(h.code)}</pre>
      ${h.tr?`<div class="tr-box">${esc(h.tr)}</div>`:''}
      <div class="actions">
        <button class="ghost" onclick="explain(${h.id},'fast',this)">⚡ ${T('Türkçe Açıkla','Explain (fast)')}</button>
        <button class="ghost" onclick="explain(${h.id},'deep',this)">🔬 ${T('Derin Açıkla','Deep explain')}</button>
      </div>
    </div>`).join('');
}
async function explain(id, depth, btn){
  btn.disabled=true; const old=btn.textContent; btn.innerHTML='<span class="spin"></span>'+T('Üretiliyor…','Generating…');
  try{
    const r = await (await fetch('/api/explain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection:'unidac',id,depth})})).json();
    const card = document.getElementById('c'+id);
    const box = document.createElement('div'); box.className='tr-box'+(depth==='deep'?' deep':'');
    box.textContent = r.text + (r.cached?'':`\n\n(${r.model} · ${r.sec} sn)`);
    card.querySelector('.actions').before(box);
  }catch(e){ alert(e); }
  btn.disabled=false; btn.textContent=old;
}

let jobTimer=null;
async function startIndex(){
  if(!confirm(T('25.201 chunk GPU ile yeniden indekslenecek (~6 dk). Başlasın mı?','Re-index 25,201 chunks on GPU (~6 min). Start?'))) return;
  await fetch('/api/index/start',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  document.getElementById('jobbar').classList.add('show');
  jobTimer = setInterval(pollJob, 1500); pollJob();
}
async function pollJob(){
  const s = await (await fetch('/api/index/status')).json();
  if(s.phase==='idle'||!s.phase) return;
  document.getElementById('jobbar').classList.add('show');
  if(!jobTimer && s.phase!=='done' && s.phase!=='error') jobTimer=setInterval(pollJob,1500);
  const pct = s.total? Math.round(100*s.done/s.total):0;
  document.getElementById('jobfill').style.width=pct+'%';
  document.getElementById('jobnums').textContent=`${(s.done||0).toLocaleString('tr')} / ${(s.total||0).toLocaleString('tr')} (${pct}%)`;
  document.getElementById('jobrate').textContent=s.rate? s.rate+' chunk/sn':'';
  document.getElementById('jobeta').textContent = s.rate&&s.total? T('kalan ','ETA ')+Math.max(0,Math.round((s.total-s.done)/s.rate))+' sn':'';
  document.getElementById('jobtitle').innerHTML = s.phase==='done'? '✅ '+T('İndeksleme tamamlandı','Indexing complete')+` (${s.sec} sn)` : s.phase==='error'? '❌ '+esc(s.error) : '<span class="spin"></span>'+T('İndeksleniyor…','Indexing…');
  if(s.phase==='done'||s.phase==='error'){ clearInterval(jobTimer); health(); setTimeout(()=>document.getElementById('jobbar').classList.remove('show'), 6000); }
}
pollJob(); // sayfa açılışında süren iş varsa yakala
</script>
</body>
</html>
