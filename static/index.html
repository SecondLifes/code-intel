<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code-Intel</title>
<style>
:root{--bg:#0b0e14;--panel:#131722;--card:#1a1f2e;--line:#252b3b;--txt:#e6e9f0;--dim:#8b93a7;--acc:#5b8cff;--acc2:#22c58b;--mono:'Cascadia Code',Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.6 'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;font-weight:600}
header h1 b{color:var(--acc)}
.pill{font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--acc2);border-color:#1b4536}
.pill.bad{color:#ef5b6b;border-color:#552731}
.sp{flex:1}
a.gear{color:var(--dim);text-decoration:none;font-size:17px}
a.gear:hover{color:var(--txt)}
.lang{cursor:pointer;user-select:none;font-size:12.5px;color:var(--dim)}
.lang b{color:var(--txt)}
#feed{flex:1;overflow-y:auto;padding:26px 0}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.msg{margin-bottom:22px;display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:78%;padding:12px 16px;border-radius:16px;font-size:14.5px}
.user .bubble{background:var(--acc);color:#fff;border-bottom-right-radius:5px}
.bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;max-width:100%;width:100%;white-space:pre-wrap}
.srcs{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.src{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.src>.head{display:flex;gap:9px;align-items:baseline;padding:8px 12px;background:#151a27;cursor:pointer;font-size:12.5px}
.src .n{font-family:var(--mono);color:var(--acc);font-weight:600}
.src .m{color:var(--dim)}
.src .sc{margin-left:auto;color:var(--acc2);font-size:11px}
.src pre{display:none;background:#0d1117;padding:11px 13px;margin:0;overflow-x:auto;font:12px/1.5 var(--mono);color:#c9d1d9;max-height:240px}
.src.open pre{display:block}
.src .exp{display:none;padding:9px 13px;background:#10241c;border-top:1px solid #1b4536;font-size:13px;white-space:pre-wrap}
.src.open .exp.has{display:block}
.src .bar2{display:none;padding:7px 12px;gap:8px;border-top:1px solid var(--line)}
.src.open .bar2{display:flex}
.src .bar2 button{font-size:12px;padding:4px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.meta-line{font-size:11.5px;color:var(--dim);margin-top:8px}
footer{padding:14px 0 20px;background:linear-gradient(transparent,var(--bg) 40%)}
.inputrow{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 18px;align-items:center}
.inputrow:focus-within{border-color:var(--acc)}
.inputrow input{flex:1;background:none;border:0;outline:none;color:var(--txt);font-size:15.5px}
.inputrow button{background:var(--acc);border:0;border-radius:11px;color:#fff;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:600}
.inputrow button:disabled{opacity:.5}
.below{display:flex;gap:6px;margin-top:9px;align-items:center;flex-wrap:wrap}
.chip{font-size:11.5px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:var(--dim);cursor:pointer;user-select:none}
.chip.on{border-color:var(--acc);color:var(--acc)}
select.mini{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:11.5px;padding:4px 8px;outline:none}
.empty{text-align:center;color:var(--dim);padding-top:11vh}
.empty .big{font-size:34px;margin-bottom:14px}
.sugg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.sugg span{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--dim)}
.sugg span:hover{border-color:var(--acc);color:var(--acc)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--dim);border-top-color:var(--acc);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes s{to{transform:rotate(360deg)}}
.jobchip{display:none;font-size:11.5px;color:var(--acc2)}
.jobchip.show{display:inline}
</style>
</head>
<body>
<header>
  <h1>⚡ Code-<b>Intel</b></h1>
  <span id="p-points" class="pill"></span>
  <span id="jobchip" class="jobchip"></span>
  <div class="sp"></div>
  <span class="lang" onclick="toggleLang()"><b id="lang-now">TR</b> / <span id="lang-alt">EN</span></span>
  <a class="gear" href="/settings" title="Ayarlar / İndeksleme">⚙️</a>
</header>

<div id="feed">
  <div class="wrap" id="feedwrap">
    <div class="empty" id="empty">
      <div class="big">⚡</div>
      <div id="empty-t1" style="font-size:17px;font-weight:600">Kod tabanınla sohbet et</div>
      <div id="empty-t2" style="font-size:13.5px;margin-top:6px">Türkçe veya İngilizce sor — kodu bulur, kaynak göstererek cevaplar</div>
      <div class="sugg" id="sugg"></div>
    </div>
  </div>
</div>

<footer><div class="wrap">
  <div class="inputrow">
    <input id="q" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()" id="btn">➤</button>
  </div>
  <div class="below">
    <span class="chip" data-a="ask" id="ch-ask">💬</span>
    <span class="chip" data-a="find" id="ch-find">🔍</span>
    <span style="width:8px"></span>
    <span class="chip on" data-m="hybrid">Hibrit</span>
    <span class="chip" data-m="dense" id="ch-dense">Anlamsal</span>
    <span class="chip" data-m="sparse" id="ch-sparse">Kelime</span>
    <div class="sp"></div>
    <select class="mini" id="s-coll"></select>
  </div>
</div></footer>

<script>
let LANG=localStorage.getItem('ci-lang')||'tr', MODE='hybrid', ACTION=localStorage.getItem('ci-action')||'ask';
const T=(tr,en)=>LANG==='tr'?tr:en, $=id=>document.getElementById(id);
const SUGG_TR=['Veritabanı bağlantısı nasıl açılıp kapatılıyor?','Transaction commit ve rollback nerede?','ApplyUpdates','Bağlantı kopunca yeniden bağlanma var mı?'];
const SUGG_EN=['How is a database connection opened and closed?','Where are transactions committed?','ApplyUpdates','Is there reconnect-on-failure logic?'];
function applyLang(){
  $('lang-now').textContent=LANG.toUpperCase();$('lang-alt').textContent=LANG==='tr'?'EN':'TR';
  $('q').placeholder=T('Kod tabanına sor… (💬 cevap yazar, 🔍 sadece bulur)','Ask the codebase… (💬 answers, 🔍 just finds)');
  $('empty-t1').textContent=T('Kod tabanınla sohbet et','Chat with your codebase');
  $('empty-t2').textContent=T('Türkçe veya İngilizce sor — kodu bulur, kaynak göstererek cevaplar','Ask in Turkish or English — it finds the code and answers with citations');
  $('ch-ask').textContent='💬 '+T('Cevapla','Answer');$('ch-find').textContent='🔍 '+T('Sadece Bul','Find only');
  $('ch-dense').textContent=T('Anlamsal','Semantic');$('ch-sparse').textContent=T('Kelime','Keyword');
  $('sugg').innerHTML=(LANG==='tr'?SUGG_TR:SUGG_EN).map(s=>`<span onclick="$('q').value=this.textContent;send()">${s}</span>`).join('');
  syncActionChips();
}
function toggleLang(){LANG=LANG==='tr'?'en':'tr';localStorage.setItem('ci-lang',LANG);applyLang();}
document.querySelectorAll('.chip[data-m]').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip[data-m]').forEach(x=>x.classList.remove('on'));c.classList.add('on');MODE=c.dataset.m;});
document.querySelectorAll('.chip[data-a]').forEach(c=>c.onclick=()=>{ACTION=c.dataset.a;localStorage.setItem('ci-action',ACTION);syncActionChips();});
function syncActionChips(){document.querySelectorAll('.chip[data-a]').forEach(x=>x.classList.toggle('on',x.dataset.a===ACTION));}
applyLang();

async function health(){try{
  const h=await(await fetch('/api/health')).json();
  const pts=(h.collections||[]).reduce((a,c)=>a+c.points,0);
  $('p-points').textContent=pts.toLocaleString('tr')+' '+T('nokta','points');
  $('p-points').className='pill '+(h.qdrant?'ok':'bad');
  const sc=$('s-coll'),cur=sc.value;
  sc.innerHTML=(h.collections||[]).filter(c=>c.name!=='pilot').map(c=>`<option>${c.name}</option>`).join('')||'<option>unidac</option>';
  if([...sc.options].some(o=>o.value===cur))sc.value=cur;
}catch(e){$('p-points').className='pill bad';$('p-points').textContent='⚠';}}
async function jobPeek(){try{
  const s=await(await fetch('/api/index/status')).json();
  const el=$('jobchip');
  if(s.phase==='embedding'||s.phase==='chunking'){el.classList.add('show');
    el.textContent='📦 '+(s.total?Math.round(100*s.done/s.total)+'%':'…')+' '+T('indeksleniyor','indexing');}
  else el.classList.remove('show');
}catch(e){}}
health();jobPeek();setInterval(()=>{health();jobPeek();},8000);

function esc(s){return (s||'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function addMsg(cls,html){
  $('empty')&&$('empty').remove();
  const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=`<div class="bubble">${html}</div>`;
  $('feedwrap').appendChild(d);$('feed').scrollTop=$('feed').scrollHeight;return d;
}
function srcCard(h,i){return `
  <div class="src" id="s${h.id}">
    <div class="head" onclick="this.parentElement.classList.toggle('open')">
      <span class="n">[${i+1}] ${esc(h.name)}</span>
      <span class="m">${esc(h.unit)} · L${h.line_start}-${h.line_end}</span>
      <span class="sc">${h.score}</span>
    </div>
    <pre>${esc(h.code)}</pre>
    <div class="exp ${h.tr?'has':''}" id="e${h.id}">${esc(h.tr||'')}</div>
    <div class="bar2">
      <button onclick="explain(${h.id},'fast',this)">⚡ ${T('Açıkla','Explain')}</button>
      <button onclick="explain(${h.id},'deep',this)">🔬 ${T('Derin','Deep')}</button>
    </div>
  </div>`;}

async function send(){
  const q=$('q').value.trim();if(!q)return;
  $('q').value='';$('btn').disabled=true;
  addMsg('user',esc(q));
  const wait=addMsg('bot','<span class="spin"></span>'+(ACTION==='ask'?T('Kod aranıyor ve cevap yazılıyor…','Searching code & writing answer…'):T('Aranıyor…','Searching…')));
  try{
    if(ACTION==='find'){
      const r=await(await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({q,collection:$('s-coll').value,mode:MODE})})).json();
      wait.querySelector('.bubble').innerHTML=r.error?('⚠️ '+esc(r.error)):
        (r.hits.length?`${r.hits.length} ${T('sonuç','results')} · ${r.ms} ms<div class="srcs">${r.hits.map(srcCard).join('')}</div>`:T('Sonuç yok','No results'));
    }else{
      const r=await(await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({q,collection:$('s-coll').value,mode:MODE,lang:LANG,model:localStorage.getItem('ci-mfast')||'gemma4:12b'})})).json();
      wait.querySelector('.bubble').innerHTML=r.error?('⚠️ '+esc(r.error)):
        esc(r.answer)+
        (r.hits&&r.hits.length?`<div class="srcs">${r.hits.slice(0,5).map(srcCard).join('')}</div>`:'')+
        `<div class="meta-line">${r.model||''} · ${T('cevap','answer')} ${r.sec||'?'} sn · ${T('arama','search')} ${r.ms_search||'?'} ms · ${MODE}</div>`;
    }
  }catch(e){wait.querySelector('.bubble').textContent='⚠️ '+e;}
  $('btn').disabled=false;$('feed').scrollTop=$('feed').scrollHeight;$('q').focus();
}
async function explain(id,depth,btn){
  btn.disabled=true;const old=btn.textContent;btn.innerHTML='<span class="spin"></span>';
  try{
    const model=depth==='deep'?(localStorage.getItem('ci-mdeep')||'qwen3.6'):(localStorage.getItem('ci-mfast')||'gemma4:12b');
    const r=await(await fetch('/api/explain',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({collection:$('s-coll').value,id,depth,model})})).json();
    const e=$('e'+id);e.textContent=r.text+(r.cached?' 📌':'');e.classList.add('has');
  }catch(err){alert(err);}
  btn.disabled=false;btn.textContent=old;
}
$('q').focus();
</script>
</body>
</html>
