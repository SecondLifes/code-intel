<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeIntel</title>
<style>
/* Palette: warm ink workshop — amber for code (the hero), teal for signal.
   Deliberately NOT the near-black + electric-blue AI default. */
:root{
  --bg:#14110c; --panel:#1b1710; --card:#211c14; --code:#0f0d09;
  --line:#332b1f; --line2:#463b2a;
  --txt:#f1ebdd; --dim:#a99a83; --faint:#6f6555;
  --amber:#e0a24a; --amber-d:#c58a37; --teal:#49b39c; --teal-d:#2f7e6c; --err:#e0704a;
  --mono:'Cascadia Code','JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.6 'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
::selection{background:rgba(224,162,74,.28)}

/* ── top bar ── */
.top{display:flex;align-items:center;gap:14px;padding:11px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-size:15.5px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.brand .bolt{color:var(--amber)}
.brand b{color:var(--amber);font-weight:700}
.brand .brand-co{color:var(--err)}
.dot{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.sp{flex:1}
.lang{cursor:pointer;user-select:none;font-size:12.5px;color:var(--faint)}
.lang b{color:var(--txt)}
.gear{color:var(--faint);text-decoration:none;font-size:16px;transition:.15s}
.gear:hover{color:var(--amber)}
.jobchip{font-size:11.5px;color:var(--teal);font-family:var(--mono);display:none}
.jobchip.show{display:inline}

/* ── fixed search zone ── */
.searchzone{padding:20px 24px 14px;border-bottom:1px solid var(--line);background:linear-gradient(var(--panel),var(--bg))}
.searchzone .inner{max-width:900px;margin:0 auto}
.field{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:6px 6px 6px 18px;transition:.15s}
.field:focus-within{border-color:var(--amber-d);box-shadow:0 0 0 3px rgba(224,162,74,.08)}
.field .mag{color:var(--faint);font-size:16px}
.field input{flex:1;background:none;border:0;outline:none;color:var(--txt);font-size:16px;padding:9px 0}
.field input::placeholder{color:var(--faint)}
.go{background:var(--amber);border:0;border-radius:10px;color:#1a1305;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.45;cursor:wait}
.controls{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg span{font-size:12.5px;padding:6px 13px;cursor:pointer;color:var(--dim);user-select:none;border-right:1px solid var(--line)}
.seg span:last-child{border-right:0}
.seg span.on{background:rgba(224,162,74,.14);color:var(--amber)}
.controls .divider{width:1px;height:20px;background:var(--line);margin:0 4px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:12px;padding:6px 9px;outline:none}
.collpicker{position:relative}
#coll-btn{cursor:pointer;font-family:inherit}
#coll-btn:hover{border-color:var(--amber-d);color:var(--amber)}
.collpop{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px;min-width:180px;max-height:240px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:20}
.collpop.show{display:block}
.collpop label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--txt)}
.collpop label:hover{background:var(--card)}
.collpop input{accent-color:var(--amber)}
.colldiv{height:1px;background:var(--line);margin:4px 2px 6px}

/* ── results (scrolls) ── */
.scroll{flex:1;overflow-y:auto;padding:22px 24px 40px}
.scroll .inner{max-width:900px;margin:0 auto}
.answer{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:12px;padding:16px 20px;font-size:14.5px;white-space:pre-wrap;margin-bottom:8px;position:relative;max-height:340px;overflow:hidden}
.answer.open,.answer.noclamp{max-height:none}
.answer::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--card));pointer-events:none;opacity:1;transition:opacity .2s}
.answer.open::after,.answer.noclamp::after{opacity:0}
.answer b.cite{color:var(--amber);font-weight:600}
.ans-toggle{display:none;margin:-2px 0 10px;font-size:12px;color:var(--teal);cursor:pointer;text-align:center;padding:5px;user-select:none;border:1px dashed var(--line2);border-radius:8px}
.ans-toggle:hover{color:var(--amber);border-color:var(--amber-d)}
.metaline{font-size:11.5px;color:var(--faint);font-family:var(--mono);margin:2px 4px 20px}
.reslabel{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:0 2px 12px}

/* Stabilite/Performans karşılaştırma tablosu (kullanıcı isteği) */
.cmp-btn{display:block;margin:4px 0 18px;padding:9px 14px;font-size:12.5px;color:var(--dim);background:var(--card);border:1px dashed var(--line2);border-radius:9px;cursor:pointer;width:100%;text-align:center}
.cmp-btn:hover{color:var(--amber);border-color:var(--amber-d)}
.cmp-wrap{overflow-x:auto;margin-bottom:20px}
.cmp-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.cmp-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--panel)}
.cmp-table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-table .cmp-name{font-family:var(--mono);color:var(--txt);font-weight:600;white-space:nowrap}
.cmp-table .cmp-src{color:var(--faint);font-size:11px;font-family:var(--mono);display:block;margin-top:2px}
/* Tabloda isim/dosya artık tıklanabilir: ilgili kaynak kartına atlar. */
.cmp-jump{cursor:pointer;border-bottom:1px dotted var(--line2)}
.cmp-jump:hover{color:var(--amber);border-bottom-color:var(--amber-d)}
.cmp-src.cmp-jump{display:inline-block}
.cmp-act{margin-left:7px;padding:1px 6px;font-size:11px;line-height:1.6;color:var(--dim);background:var(--panel);border:1px solid var(--line2);border-radius:6px;cursor:pointer;vertical-align:middle}
.cmp-act:hover{color:var(--amber);border-color:var(--amber-d)}
/* Atlanan kart bir an vurgulanır — uzun listede nereye gidildiği görünsün. */
@keyframes cmpflash{0%{box-shadow:0 0 0 2px var(--amber)}100%{box-shadow:0 0 0 2px transparent}}
.src.cmp-flash{animation:cmpflash 1.4s ease-out}
.cmp-table .cmp-reason{color:var(--dim);font-size:12.5px}
.cmp-score{font-family:var(--mono);font-weight:700;text-align:center;border-radius:6px;padding:3px 9px!important}
.cmp-score.hi{color:var(--teal);background:rgba(73,179,156,.1)}
.cmp-score.mid{color:var(--amber);background:rgba(224,162,74,.1)}
.cmp-score.lo{color:var(--err);background:rgba(224,112,74,.1)}

.src{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--card)}
.src .head{display:flex;align-items:baseline;gap:11px;padding:11px 15px;cursor:pointer}
.src .idx{font-family:var(--mono);color:var(--amber);font-weight:700;font-size:13px}
.src .n{font-family:var(--mono);color:var(--txt);font-weight:600;font-size:13.5px}
.src .m{color:var(--dim);font-size:12px;font-family:var(--mono)}
.collbadge{font-size:10.5px;color:var(--teal);background:rgba(73,179,156,.1);padding:2px 7px;border-radius:6px;font-family:var(--mono);white-space:nowrap}
.src .sc{margin-left:auto;color:var(--teal);font-size:11.5px;font-family:var(--mono);background:rgba(73,179,156,.1);padding:2px 8px;border-radius:6px}
/* code preview ALWAYS visible, capped; expands on click */
.src .codewrap{position:relative;max-height:132px;overflow:hidden;transition:max-height .25s ease}
.src.open .codewrap{max-height:520px;overflow:auto}
.src .codewrap::after{content:'';position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,var(--code));pointer-events:none;transition:opacity .2s}
.src.open .codewrap::after{opacity:0}
/* Kompakt görünüm: başlık satırı HER ZAMAN görünür kalır (tek gerçek zorunluluk) —
   sadece kod önizlemesi ve boşluklar daraltılır, ekrana daha çok sonuç sığar. */
#out.compact .src{margin-bottom:6px}
#out.compact .src .head{padding:7px 12px}
#out.compact .src .codewrap{max-height:0}
#out.compact .src.open .codewrap{max-height:400px}
#out.compact .src .codewrap::after{display:none}
#out.compact .tools{padding:5px 12px}
#compact-btn.on{background:var(--amber);color:#1a1305;border-color:var(--amber)}
pre{background:var(--code);margin:0;padding:12px 16px;font:12.5px/1.55 var(--mono);color:#d8cbb0;overflow-x:auto}
pre mark{background:rgba(73,179,156,.28);color:inherit;border-radius:3px;padding:0 1px}
/* Sıra 1 (kullanıcı): "highlighting arama sayfasında kullanılmamış... heryerde
   kullanılacak" — manual.py'deki AYNI tema (self-hosted highlight.js) */
.hljs{background:transparent;color:var(--txt)}
.hljs-comment,.hljs-quote{color:var(--faint);font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-subst,.hljs-name,.hljs-tag{color:var(--amber)}
.hljs-string,.hljs-doctag,.hljs-regexp,.hljs-addition{color:var(--teal)}
.hljs-number,.hljs-symbol,.hljs-bullet,.hljs-link{color:var(--amber-d)}
.hljs-title,.hljs-type,.hljs-class .hljs-title,.hljs-built_in,.hljs-attr,.hljs-attribute{color:var(--teal-d)}
.hljs-variable,.hljs-template-variable,.hljs-params{color:var(--dim)}
.hljs-deletion{color:var(--err)}
.hljs-emphasis{font-style:italic}
.hljs-strong{font-weight:700}
.exp{display:none;padding:11px 16px;background:rgba(73,179,156,.06);border-top:1px solid var(--line);font-size:13.5px;white-space:pre-wrap;color:#dfe8e3}
.exp.has{display:block}
.rel{display:none;padding:11px 16px;background:rgba(224,162,74,.05);border-top:1px solid var(--line);font-size:12.5px}
.rel.has{display:block}
.rel-group{margin-bottom:10px}
.rel-group:last-child{margin-bottom:0}
.rel-group h4{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:600}
.rel-empty{color:var(--faint);font-style:italic}
.rel-item{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:4px 10px;margin:0 6px 6px 0;cursor:pointer;font-family:var(--mono);color:var(--txt);font-size:12px;transition:.15s}
.rel-item:hover{border-color:var(--amber-d);color:var(--amber)}
.rel-item .u{color:var(--faint);font-size:10.5px}
.tools{display:flex;gap:8px;padding:9px 15px;border-top:1px solid var(--line)}
.tools button{font-size:12px;padding:5px 13px;border-radius:8px;background:var(--panel);border:1px solid var(--line2);color:var(--dim);cursor:pointer;transition:.15s}
.tools button:hover{border-color:var(--amber-d);color:var(--amber)}
.tools .more{margin-left:auto;color:var(--faint);border:0;background:none;font-size:12px}
.loadmore{display:block;margin:16px auto 4px;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--dim);font-size:13px;padding:9px 22px;cursor:pointer;transition:.15s}
.loadmore:hover{border-color:var(--amber-d);color:var(--amber)}
.loadmore:disabled{opacity:.5;cursor:wait}
.loadmore .spin{margin-right:6px}
.hitgroup{margin-bottom:20px}
.hitgroup-head{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin:0 2px 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.hg-owner{color:var(--dim)}
.hg-coll{color:var(--amber)}
.hg-count{color:var(--faint);text-transform:none;letter-spacing:0}
#sidepanel{position:fixed;top:0;right:0;width:min(640px,92vw);height:100%;background:var(--panel);border-left:1px solid var(--line2);box-shadow:-12px 0 32px rgba(0,0,0,.4);z-index:30;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
#sidepanel.show{transform:translateX(0)}
#sidepanel.dragging{transition:none}
#sp-resize{position:absolute;left:-4px;top:0;width:8px;height:100%;cursor:ew-resize;z-index:31}
#sp-resize:hover,#sp-resize.dragging{background:rgba(224,162,74,.18)}
.sp-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
.sp-fname{font-family:var(--mono);font-size:13px;color:var(--amber);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sp-close{background:none;border:0;color:var(--faint);font-size:16px;cursor:pointer;padding:2px 8px}
.sp-close:hover{color:var(--amber)}
.sp-body{flex:1;overflow:auto;padding:0}
.sp-body pre{margin:0;padding:16px 20px;font:12.5px/1.6 var(--mono);color:#d8cbb0;white-space:pre;overflow-x:auto}
.sp-body pre span[data-ln]{display:block;padding-left:8px;border-left:2px solid transparent}
.sp-body pre span.hlline{background:rgba(224,162,74,.16);border-left-color:var(--amber)}
.sp-err{padding:20px;color:#e0704a}

.hero{text-align:center;padding-top:9vh;color:var(--dim)}
.hero .mark{font-size:46px;color:var(--amber);opacity:.85;margin-bottom:16px;font-family:var(--mono)}
.hero h2{font-size:19px;font-weight:600;color:var(--txt);margin-bottom:6px}
.hero p{font-size:13.5px}
.sugg{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:22px;max-width:640px;margin-left:auto;margin-right:auto}
.sugg span{font-size:12.5px;border:1px solid var(--line2);border-radius:9px;padding:8px 14px;cursor:pointer;color:var(--dim);font-family:var(--mono);transition:.15s}
.sugg span:hover{border-color:var(--amber-d);color:var(--amber);background:rgba(224,162,74,.06)}

.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line2);border-top-color:var(--amber);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.scroll::-webkit-scrollbar{width:10px}.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
/* SweetAlert2 — aynı "ink workshop" paleti (settings.html ile tutarlı) */
.swal2-popup.ci-swal{background:var(--panel);color:var(--txt);border:1px solid var(--line2);border-radius:14px;font:15px/1.6 'Segoe UI',system-ui,sans-serif}
.ci-swal .swal2-title{color:var(--txt);font-size:18px}
.ci-swal .swal2-html-container{color:var(--dim)}
.ci-swal .swal2-input,.ci-swal .swal2-textarea{background:var(--card);border:1px solid var(--line2);color:var(--txt);box-shadow:none;font-size:14px}
.ci-swal .swal2-input:focus,.ci-swal .swal2-textarea:focus{border-color:var(--amber-d);box-shadow:0 0 0 3px rgba(224,162,74,.08)}
.ci-swal-btn{background:var(--amber)!important;color:#1a1305!important;border:0!important;box-shadow:none!important;font-weight:700!important;border-radius:10px!important}
.ci-swal-btn:hover{background:var(--amber-d)!important}
.ci-swal-btn-cancel{background:var(--card)!important;color:var(--dim)!important;border:1px solid var(--line2)!important;box-shadow:none!important;border-radius:10px!important}
.ci-swal-btn-danger{background:var(--err)!important}
.ci-swal-toast{background:var(--panel)!important;color:var(--txt)!important;border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ci-swal-toast .swal2-title{font-size:14px;color:var(--txt)}
</style>
<script src="/static/vendor/sweetalert2.min.js"></script>
<script src="/static/vendor/highlightjs/highlight.min.js"></script>
</head>
<body>
<div class="top">
  <div class="brand"><span class="bolt">⚡</span><span class="brand-co">Code</span><b>Intel</b></div>
  <span class="dot" id="pts"></span>
  <span class="jobchip" id="jobchip"></span>
  <div class="sp"></div>
  <span class="lang" onclick="toggleLang()"><b id="ln">TR</b> / <span id="la">EN</span></span>
  <a class="gear" href="/api" title="API">🔌</a>
  <a class="gear" href="/settings" title="Ayarlar">⚙</a>
</div>

<div class="searchzone"><div class="inner">
  <div class="field">
    <span class="mag">🔍</span>
    <input id="q" onkeydown="if(event.key==='Enter')run()">
    <button class="go" id="go" onclick="run()">➤</button>
  </div>
  <div class="controls">
    <div class="seg" id="seg-act">
      <span data-a="ask" class="on">💬 <span id="a-ask">Cevapla</span></span>
      <span data-a="research">🔬 <span id="a-res">Derin</span></span>
      <span data-a="find">🔍 <span id="a-find">Bul</span></span>
    </div>
    <div class="divider"></div>
    <div class="seg" id="seg-mode">
      <span data-m="hybrid" class="on" id="m-hy">Hibrit</span>
      <span data-m="dense" id="m-de">Anlamsal</span>
      <span data-m="sparse" id="m-sp">Kelime</span>
    </div>
    <div class="divider"></div>
    <select class="mini" id="f-kind" title="Parça türü">
      <option value="">Tümü</option>
      <option value="method">method</option>
      <option value="decl">decl</option>
      <option value="type">type</option>
    </select>
    <input class="mini" id="f-unit" placeholder="dosya süzgeci" style="width:110px" title="unit yolu alt-dizesi, örn. Providers/">
    <select class="mini" id="f-lang" title="Programlama dili">
      <option value="">Tüm diller</option>
      <option value="pascal">Pascal/Delphi</option>
      <option value="python">Python</option>
      <option value="csharp">C#</option>
      <option value="cpp">C++</option>
      <option value="c">C</option>
      <option value="java">Java</option>
      <option value="javascript">JavaScript</option>
      <option value="typescript">TypeScript</option>
      <option value="go">Go</option>
      <option value="rust">Rust</option>
    </select>
    <label class="mini" id="rr-label" style="display:flex;align-items:center;gap:6px;cursor:pointer" title="Cross-encoder ile yeniden sıralama — daha isabetli, biraz daha yavaş">
      <input type="checkbox" id="rr-toggle" style="accent-color:var(--amber)">
      <span id="t-rr">🎯 Hassas sıra</span>
    </label>
    <label class="mini" id="rk-wrap" style="display:none;align-items:center;gap:6px" title="Derin araştırmada ana sonucun yanına bağlama eklenecek ilgili kayıt sayısı">
      <span id="t-rk">🔢 İlgili kayıt</span>
      <select class="mini" id="rk-select" style="width:auto"></select>
    </label>
    <div class="sp"></div>
    <select class="mini" id="ws-select" onchange="applyWorkspace()" title="Kayıtlı çalışma alanları"><option value="">WS…</option></select>
    <button class="mini" id="ws-save" onclick="saveWorkspace()" type="button" title="Mevcut ayarları çalışma alanı olarak kaydet">💾</button>
    <button class="mini" id="ws-del" onclick="deleteWorkspace()" type="button" title="Seçili çalışma alanını sil">🗑</button>
    <label class="mini" id="group-toggle-label" style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="group-toggle" onchange="toggleGrouping(this.checked)" style="accent-color:var(--amber)">
      <span id="t-grouptoggle">Sahibe/Koleksiyona göre grupla</span>
    </label>
    <button class="mini" id="compact-btn" onclick="toggleCompact()" type="button" title="Kompakt görünüm">▤</button>
    <div class="collpicker" id="collpicker">
      <button class="mini" id="coll-btn" onclick="toggleCollPicker(event)" type="button">unidac ▾</button>
      <div class="collpop" id="collpop"></div>
    </div>
  </div>
</div></div>

<div class="scroll"><div class="inner" id="out">
  <div class="hero" id="hero">
    <div class="mark">{ }</div>
    <h2 id="h-t1">Kod tabanına sor</h2>
    <p id="h-t2">Türkçe ya da İngilizce — kodu bulur, kaynak göstererek yanıtlar.</p>
    <div class="sugg" id="sugg"></div>
  </div>
</div></div>

<div id="sidepanel">
  <div id="sp-resize"></div>
  <div class="sp-head">
    <span class="sp-fname" id="sp-fname">…</span>
    <button class="sp-close" onclick="copySidePanel()" id="sp-copy" title="Kopyala">📋</button>
    <button class="sp-close" onclick="closeSidePanel()">✕</button>
  </div>
  <div class="sp-body" id="sp-body"></div>
</div>

<script>
let LANG=localStorage.getItem('ci-lang')||'tr', MODE='hybrid', ACT=localStorage.getItem('ci-act')||'ask';

// ---- SweetAlert2 sarmalayıcıları — native alert/confirm/prompt yerine, panel temasıyla ----
const SWAL_BASE={customClass:{popup:'ci-swal',confirmButton:'ci-swal-btn',cancelButton:'ci-swal-btn-cancel',input:'ci-swal-input'},buttonsStyling:false};
function ciAlert(msg,icon){return Swal.fire({...SWAL_BASE,icon:icon||'info',html:msg,confirmButtonText:T('Tamam','OK')});}
function ciError(msg){return Swal.fire({...SWAL_BASE,icon:'error',html:String(msg&&msg.message||msg),confirmButtonText:T('Tamam','OK')});}
async function ciConfirm(msg,opts){
  opts=opts||{};
  const r=await Swal.fire({...SWAL_BASE,icon:opts.icon||'warning',html:msg,showCancelButton:true,
    confirmButtonText:opts.confirmText||T('Evet','Yes'),cancelButtonText:T('Vazgeç','Cancel'),
    customClass:{...SWAL_BASE.customClass,confirmButton:opts.danger?'ci-swal-btn ci-swal-btn-danger':'ci-swal-btn'}});
  return r.isConfirmed;
}
async function ciPrompt(title,defaultValue){
  const r=await Swal.fire({...SWAL_BASE,icon:'question',title:title,input:'text',inputValue:defaultValue||'',
    showCancelButton:true,confirmButtonText:T('Tamam','OK'),cancelButtonText:T('Vazgeç','Cancel')});
  return r.isConfirmed?r.value:null;
}
function ciToast(msg,icon){
  return Swal.mixin({toast:true,position:'top-end',showConfirmButton:false,timer:3200,timerProgressBar:true,
    customClass:{popup:'ci-swal-toast'},didOpen:(t)=>{t.addEventListener('mouseenter',Swal.stopTimer);t.addEventListener('mouseleave',Swal.resumeTimer);}
  }).fire({icon:icon||'success',title:msg});
}

async function health(){try{

function toggleAllColls(checked){

// Dış analiz (Codex, 2026-07-25) bulgusu: esc() yalnız &<> kaçırıyordu, tırnak
// işaretlerini KAÇIRMIYORDU — title="${esc(x)}" gibi öznitelik bağlamlarında
// x bir " içeriyorsa özniteliğin dışına çıkılabiliyordu. Artık " ve ' da kaçıyor.
function esc(s){return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// esc() TEK BAŞINA onclick="fn('${x}')" gibi iç içe JS bağlamlarını GÜVENLİ
// KILMAZ: tarayıcı onclick özniteliğini ÖNCE HTML olarak çözer (ör. &#39; -> ')
// SONRA bu çözülmüş metni JS kodu gibi ayrıştırır — yani HTML kaçırma tek
// başına ' karakterinin JS string'inden çıkmasını engellemez (dış analizde
// bulunan gerçek stored-XSS vektörü: h.collection/h.kind hiç kaçırılmadan,
// h.name yalnız esc() ile onclick içine gömülüyordu). escJs() önce JS string
// kaçışı (\, ', \n) uygular, SONRA öznitelik (çift tırnak/&) kaçışı — bu sırayla
// tarayıcı HTML'i çözüp JS'i ayrıştırdığında değer güvenli bir string sabiti olarak kalır.
function escJs(s){
  const j=(s||'').toString().replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'\\r');
  return j.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Sıra 1 (kullanıcı): "highlighting arama sayfasında kullanılmamış... heryerde
// kullanılacak" — manual.py'deki AYNI 3 bilinen istisna eşlemesi (dosya adları
// static/vendor/highlightjs/languages'e göre doğrulandı).
const HLJS_ALIAS={pascal:'delphi',objc:'objectivec',vb:'vbnet'};
const HLJS_UNSUPPORTED=new Set(['zig','solidity','gdscript','odin','gleam']);
// eski (v1 chunker ile) indekslenmiş koleksiyonlarda "lang" alanı hiç YOK —
// bu proje temelde Delphi olduğu için ".pas" uzantısından çıkarım yapılıyor
// (canlı testte fark edildi: unidac gibi eski indekslerde h.lang null geliyordu).
function inferLangFromUnit(unit){
  const m=/\.([a-z0-9]+)$/i.exec(unit||'');
  return m&&['pas','pp','dpr','dpk','inc','lpr'].includes(m[1].toLowerCase())?'pascal':'';
}
function hljsLangFor(lang){
  if(!lang||HLJS_UNSUPPORTED.has(lang))return '';
  return HLJS_ALIAS[lang]||lang;
}
var HLJS_LOADED={};
function hlApply(codeEl,hljsLang,done){
  if(!hljsLang||typeof hljs==='undefined'){if(done)done();return;}
  codeEl.className='language-'+hljsLang;
  function finish(){hljs.highlightElement(codeEl);if(done)done();}
  if(HLJS_LOADED[hljsLang]==='ok'){finish();return;}
  if(HLJS_LOADED[hljsLang]==='error'){if(done)done();return;}
  const s=document.createElement('script');
  s.src='/static/vendor/highlightjs/languages/'+hljsLang+'.min.js';
  s.onload=()=>{HLJS_LOADED[hljsLang]='ok';finish();};
  s.onerror=()=>{HLJS_LOADED[hljsLang]='error';if(done)done();};
  document.head.appendChild(s);
}
// hljs tokenize ettikten SONRA sorgu terimlerini işaretle (markQuery innerHTML
// üstünde tag-güvenli çalışıyor) — sırayı TERSİNE çevirmek (önce mark, sonra
// hljs) mark'ları SİLER, çünkü highlightElement innerHTML'i TAMAMEN değiştirir.
function applyCodeEnhancements(root){
  (root||document).querySelectorAll('.codewrap code').forEach(el=>{
    const lang=el.dataset.hljsLang||'';
    hlApply(el,lang,()=>{el.innerHTML=markQuery(el.innerHTML);});
  });
  // boyama bittikten sonra gercek yukseklik belli olur -> tasmayan kartlarda
  // "genislet" dugmesini gizle
  setTimeout(()=>{try{pruneExpandButtons(root);}catch(e){}},0);
}
// Sorgu terimlerini kod önizlemesinde işaretle — "bu sonuç neden geldi"nin
// satır-düzeyi yanıtı. Tag içlerine (span/mark) bulaşmasın diye tag-dışı guard'lı.
function markQuery(html){
  const toks=[...new Set((LAST_Q||'').split(/[^a-zA-Z0-9]+/).filter(t=>t.length>=3))].slice(0,8);
  for(const t of toks){
    const safe=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    html=html.replace(new RegExp('(?![^<]*>)('+safe+')','gi'),'<mark>$1</mark>');
  }
  return html;
}

let WS_LIST=[];
async function loadWorkspaces(){
  try{WS_LIST=(await(await fetch('/api/workspaces')).json()).workspaces||[];}catch(e){WS_LIST=[];}

function currentConfig(){

          rerank:$('rr-toggle').checked, group:GROUP_MODE, lang:$('f-lang').value};

async function saveWorkspace(){
  const name=await ciPrompt(T('Çalışma alanı adı:','Workspace name:'), $('ws-select').value||'');
  if(!name)return;
  await fetch('/api/workspaces',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,config:currentConfig()})});
  await loadWorkspaces();$('ws-select').value=name;
  ciToast(T('Çalışma alanı kaydedildi.','Workspace saved.'));
}
async function deleteWorkspace(){
  const name=$('ws-select').value;
  if(!name||!(await ciConfirm(T(`"${name}" çalışma alanı silinsin mi?`,`Delete workspace "${name}"?`),{danger:true})))return;
  await fetch('/api/workspaces?name='+encodeURIComponent(name),{method:'DELETE'});
  await loadWorkspaces();
}
function applyWorkspace(){
  const w=WS_LIST.find(x=>x.name===$('ws-select').value);
  if(!w)return;
  const c=w.config||{};
  if(Array.isArray(c.collections)&&c.collections.length){
    SELECT_ALL_MODE=false;localStorage.setItem('ci-colls-allmode','0');
    SELECTED_COLLS=c.collections.filter(n=>ALL_COLLS.includes(n));
    if(!SELECTED_COLLS.length)SELECTED_COLLS=[ALL_COLLS[0]];
    localStorage.setItem('ci-colls',JSON.stringify(SELECTED_COLLS));renderCollPicker();
  }
  if(c.mode){MODE=c.mode;[...$('seg-mode').children].forEach(x=>x.classList.toggle('on',x.dataset.m===MODE));}
  $('f-kind').value=c.kind||'';$('f-unit').value=c.unit||'';$('rr-toggle').checked=!!c.rerank;$('f-lang').value=c.lang||'';
  if(typeof c.group==='boolean'){GROUP_MODE=c.group;$('group-toggle').checked=c.group;localStorage.setItem('ci-groupmode',c.group?'1':'0');}
}
function citeFmt(t){return esc(t).replace(/\[(\d+)\]/g,'<b class="cite">[$1]</b>');}
// "Neden geldi" — sıralama açıklaması (dense/sparse ham sırası, isim boost'u,
// rerank olasılığı). Geri bildirimle birlikte sıralama ayıklamasının temel aracı.
function whyText(w){
  if(!w)return '';
  const p=[];
  if(w.dense_rank)p.push(T('anlamsal #','semantic #')+w.dense_rank);
  if(w.sparse_rank)p.push(T('kelime #','keyword #')+w.sparse_rank);
  if(w.name_boost)p.push(T('isim boost ×','name boost ×')+w.name_boost);
  if(w.rerank_prob!==undefined)p.push('rerank '+w.rerank_prob);
  if(w.priority_boost)p.push(T('yıldız ×','star ×')+w.priority_boost);
  // Stabilite/Performans tablosundan gelen puan — sıradaki kaymanın sebebi
  // görünür olsun (etki bilerek zayıf, bkz. retrieval.CMP_SCORE_WEIGHT).
  if(w.cmp_score!==undefined)p.push(T('puan ','score ')+w.cmp_score+'/10 ×'+w.cmp_boost);
  return p.join(' · ');
}
async function sendFeedback(id,collection,name,verdict,btn){
  btn.disabled=true;const old=btn.textContent;
  try{
    await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({collection,id:+id,q:LAST_Q,verdict,name})});
    btn.textContent='✓';setTimeout(()=>{btn.textContent=old;btn.disabled=false;},1500);
  }catch(e){btn.disabled=false;}
}

  return `
  <div class="src" id="s${h.id}">

      ${whyText(h.why)?`<span class="m" style="cursor:help" title="${esc(whyText(h.why))}">ⓘ</span>`:''}
      <span class="sc">${h.score}</span>

      <button onclick="explain('${h.id}','${escJs(h.collection)}','deep',this)">🔬 ${T('Derin','Deep')}</button>
      <button onclick="showRelations('${h.id}','${escJs(h.collection)}',this,'${escJs(h.kind)}','${escJs((h.name||'').split('=')[0].trim())}')">🔗 ${T('İlişkiler','Relations')}</button>
      <button onclick="reveal('${h.id}','${escJs(h.collection)}','file',this)">📄 ${T('Dosyayı Aç','Open File')}</button>
      <button onclick="reveal('${h.id}','${escJs(h.collection)}','folder',this)">📂 ${T('Klasörü Aç','Open Folder')}</button>
      <button onclick="showInBrowser('${h.id}','${escJs(h.collection)}',this,${h.line_start||0},'${escJs(hljsLang)}')">🌐 ${T('Tarayıcıda Göster','Show in Browser')}</button>
      <button title="${T('İyi sonuç','Good result')}" onclick="sendFeedback('${h.id}','${escJs(h.collection)}','${escJs(h.name)}','up',this)">👍</button>
      <button title="${T('Alakasız sonuç','Irrelevant result')}" onclick="sendFeedback('${h.id}','${escJs(h.collection)}','${escJs(h.name)}','down',this)">👎</button>

  </div>`;}
// Sıra 5 (kullanıcı, canlı doğrulamada bulunan gerçek hata): birçok kod bloğu
// "genişlet"e tıklanınca açılmıyordu. Kök neden: classList.toggle sonrası
// tarayıcı bazı elemanlarda max-height geçişini (transition) hiç tetiklemiyor
// — computed style YENİ değeri döndürse bile render'a hiç YANSIMIYORDU (uzun
// içerikli kartlarda tekrarlanabilir şekilde doğrulandı: offsetHeight okuması
// ZORLA senkron reflow yaptırınca sorun kayboluyor). void el.offsetHeight
// bu yüzden eklendi — tarayıcının layout/paint'i hemen taze bilgiyle
// güncellemesini garantiler.
// Kullanici bildirimi: "genislet dugmesi cogunda calismiyor". OLCULDU: dugme
// aslinda DOGRU calisiyor — .open sinifi max-height'i 132px'den 520px'e cikariyor.
// Sorun su ki arama sonuclarinin cogu kisa fonksiyon ve onizleme ZATEN 132px'e
// siginca genisletecek bir sey kalmiyor, tiklamak gorunur hicbir sey yapmiyor.
// (Sunucudan "tam kod" cekmeyi denedim ve olctum: 12 sonucun 12'sinde tam kod
// onizlemeyle AYNI — search() zaten tam kodu donduruyor, kirpma yok. O yuzden
// ek bir uc eklemek olu agirlik olurdu.) Gercek cozum: tasma yoksa dugmeyi hic
// gosterme, boylece dugme her zaman ise yarar.
function tog(id){const el=$('s'+id);el.classList.toggle('open');void el.offsetHeight;}

// Kart cizildikten sonra: icerik gercekten tasiyor mu? Tasmiyorsa "genislet"i
// gizle (ve basligin tiklama imlecini kaldir) — yaniltici bir dugme birakma.
function pruneExpandButtons(root){
  (root||document).querySelectorAll('.src').forEach(el=>{
    const cw=el.querySelector('.codewrap'), btn=el.querySelector('button.more');
    if(!cw||!btn)return;
    const overflows=cw.scrollHeight>cw.clientHeight+2;
    btn.style.display=overflows?'':'none';

let LAST_Q='', LAST_OFFSET=0, ALL_HITS=[];
const PAGE_SIZE=8;
// Gruplama İSTEĞE BAĞLI bir görünüm anahtarı (checkbox) — otomatik/zorla
// açılmaz. Gerçek kullanıcı geri bildirimi: gruplar "ilk görülme sırasına" göre
// dizildiğinde, en alakalı tekil sonuca sahip olmayan ama toplamda güçlü bir
// koleksiyon en sona düşüp gözden kaçabiliyordu — bu yüzden gruplamayı açık
// biçimde kullanıcı seçsin, varsayılan KAPALI (saf alaka sıralaması).
let GROUP_MODE=localStorage.getItem('ci-groupmode')==='1';
$('group-toggle').checked=GROUP_MODE;
function toggleGrouping(checked){
  GROUP_MODE=checked;
  localStorage.setItem('ci-groupmode',checked?'1':'0');
  // #hitlist yalniz 'find' modunda var — 'Cevapla'/'Derin' modunda yokken
  // gruplamayi acmak null.innerHTML ile patliyordu.
  const hl=$('hitlist');
  if(ALL_HITS.length&&hl){
    hl.innerHTML=renderHitList(ALL_HITS);
    applyCodeEnhancements();
  }
}
function renderHitList(hits){
  if(!GROUP_MODE)return hits.map((h,i)=>srcCard(h,i)).join('');
  const groups=[], byKey={};
  hits.forEach(h=>{
    const meta=COLL_META[h.collection]||{};
    const key=(meta.owner||'')+' '+h.collection;
    if(!byKey[key]){byKey[key]={owner:meta.owner||'',collection:h.collection,items:[]};groups.push(byKey[key]);}
    byKey[key].items.push(h);
  });
  let idx=0;
  if(groups.length<=1)return hits.map(h=>srcCard(h,idx++)).join('');
  return groups.map(g=>{
    const label=(g.owner?`<span class="hg-owner">${esc(g.owner)}</span> / `:'')+`<span class="hg-coll">${esc(g.collection)}</span>`;
    const body=g.items.map(h=>srcCard(h,idx++)).join('');
    return `<div class="hitgroup"><div class="hitgroup-head">📦 ${label} <span class="hg-count">(${g.items.length})</span></div>${body}</div>`;
  }).join('');
}
function searchBody(offset){
  return {q:LAST_Q,collections:SELECTED_COLLS,mode:MODE,top_k:PAGE_SIZE,offset,
          kind:$('f-kind').value,unit:$('f-unit').value.trim(),rerank:$('rr-toggle').checked,lang:$('f-lang').value};
}
// Çok turlu sohbet geçmişi — sunucu stateless; geçmiş artık localStorage'da
// KALICI (sayfa yenilense de sürer), "🧹" temizler, "⬇" markdown indirir.
let CHAT_HISTORY=JSON.parse(localStorage.getItem('ci-chat')||'[]');
function persistChat(){localStorage.setItem('ci-chat',JSON.stringify(CHAT_HISTORY));}
function clearChat(){CHAT_HISTORY=[];persistChat();const el=$('chatchip');if(el)el.remove();}
function exportChat(){
  if(!CHAT_HISTORY.length)return;
  const md=CHAT_HISTORY.map(t=>`## ❓ ${t.q}\n\n${t.a}\n`).join('\n---\n\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['# CodeIntel Sohbet\n\n'+md],{type:'text/markdown'}));
  a.download='codeintel-sohbet.md';a.click();URL.revokeObjectURL(a.href);
}
function chatChip(){
  return CHAT_HISTORY.length?` · <span id="chatchip">💬 ${CHAT_HISTORY.length} ${T('tur','turns')} <span style="cursor:pointer" onclick="clearChat()" title="${T('Sohbet geçmişini temizle','Clear chat history')}">🧹</span> <span style="cursor:pointer" onclick="exportChat()" title="${T('Sohbeti markdown indir','Download chat as markdown')}">⬇</span></span>`:'';
}
async function run(){
  const q=$('q').value.trim();if(!q)return;
  // TUM arama-basina durum burada sifirlanmali. Eskiden yalniz LAST_Q/LAST_OFFSET
  // sifirlaniyordu; ALL_HITS yalniz 'find' dalinda, CMP_* yalniz runAskStream'de
  // atandigi icin MOD DEGISTIRINCE onceki aramanin verisi hayatta kaliyordu
  // (kullanici bildirimi: "yeni aramalarda eski arama verilerini temizlemiyor"):
  //  - toggleGrouping() bayat ALL_HITS'i okuyup olmayan #hitlist'e yazip patliyordu,
  //  - Stabilite/Performans tablosu bayat CMP_Q/CMP_HITS ile ONCEKI soruya gore kuruluyordu.
  // Önceki arama hâlâ akıyorsa GERÇEKTEN iptal et: yalnız DOM yazımını
  // engellemek yetmez, sunucudaki üretim de sürüyor (derin modda ~220 sn GPU
  // meşgul) — "ekran bir süre kilitleniyor" hissinin sebebi buydu.
  if(RUN_ABORT)RUN_ABORT.abort();
  RUN_ABORT=new AbortController();
  const myRun=++RUN_SEQ, sig=RUN_ABORT.signal;
  LAST_Q=q;LAST_OFFSET=0;ALL_HITS=[];CMP_Q='';CMP_HITS=[];
  $('go').disabled=true;
  $('out').innerHTML=`<div class="answer"><span class="spin"></span>${ACT==='ask'?T('Kod aranıyor, yanıt yazılıyor…','Searching code, writing answer…'):T('Aranıyor…','Searching…')}</div>`;
  try{
    if(ACT==='find'){
      const r=await(await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(searchBody(0)),signal:sig})).json();
      if(myRun!==RUN_SEQ)return;   // bayat koşu: DOM artık yeni aramanın
      ALL_HITS=r.hits||[];
      $('out').innerHTML=r.error?err(r.error):(r.hits.length
        ?`<div class="reslabel" id="reslabel">${r.hits.length} / ${r.total} ${T('sonuç gösteriliyor','results shown')} · ${r.ms} ms · ${MODE}${r.rerank?' · 🎯':''}</div>`+
          `<div id="hitlist">${renderHitList(ALL_HITS)}</div>`+
          (r.has_more?`<button class="loadmore" id="loadmore" onclick="loadMore()">${T('Daha Fazla Göster','Show More')} ▾</button>`:'')
        :none());
      applyCodeEnhancements();
    }else{
      await runAskStream(q, ACT==='research', myRun, sig);
    }
  }catch(e){
    // İptal edilmiş ya da bayat koşu ASLA ekrana yazmaz — eski davranışta tam
    // burası yeni aramanın sonucunu hata kutusuyla eziyordu.
    if(myRun!==RUN_SEQ||e.name==='AbortError')return;
    $('out').innerHTML=err(e);
  }finally{
    if(myRun===RUN_SEQ){$('go').disabled=false;$('q').focus();}
  }
}
async function runAskStream(q, research, myRun, sig){
  // research=true: derin araştırma modu — context pack (tam kod + çağrı/tip/unit
  // bağlamı) + derin model; adımlar SSE 'step' olaylarıyla ekranda görünür
  // Kayitli bir secim yoksa BOS gonderilir: sunucu `r.model or _CFG.get(...)`
  // yaptigi icin mcp-config.json'daki fast_model/deep_model devreye girer.
  // Eskiden burada model adi SABIT yaziliydi, bu yuzden config'i degistirmek
  // panelde hicbir sey degistirmiyordu.
  const model=research?(localStorage.getItem('ci-mdeep')||''):(localStorage.getItem('ci-mfast')||'');
  const url=research?'/api/research/stream':'/api/ask/stream';
  // 3. tur, Madde 6 (kullanıcı): uzak Ollama sunucusu — yalnız bu iki sohbet
  // ucuna eklenir (ayarlar sayfasında kaydedilir), boşsa alan hiç gönderilmez
  // (sunucu kendi varsayılanını kullanır).
  const ollamaUrl=localStorage.getItem('ci-ollama-url')||'';
  const bodyObj=research
    ?{q,collections:SELECTED_COLLS,lang:LANG,model,related_k:parseInt($('rk-select').value)||5,ollama_url:ollamaUrl}
    :{q,collections:SELECTED_COLLS,mode:MODE,lang:LANG,model,history:CHAT_HISTORY,ollama_url:ollamaUrl};
  const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(bodyObj),signal:sig});
  if(myRun!==RUN_SEQ)return;
  if(!resp.ok||!resp.body){$('out').innerHTML=err('HTTP '+resp.status);return;}
  $('out').innerHTML=`<div class="answer" id="ans"><span class="spin"></span></div><div id="anstoggle" class="ans-toggle" onclick="togAns()"></div><div class="metaline" id="ansmeta"></div><div id="anssrc"></div><div id="cmpwrap"></div>`;
  CMP_Q=q;CMP_HITS=[];
  let meta=null,text='',sec='?',truncated=false;
  const reader=resp.body.getReader(),dec=new TextDecoder();
  let buf='';
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    // Bu okuma sırasında yeni bir arama başladıysa DOM'umuz (#ans/#anssrc/
    // #cmpwrap) çoktan silinmiş demektir — tek satır bile yazmadan çekil.
    if(myRun!==RUN_SEQ)return;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n\n'))>=0){
      const block=buf.slice(0,i);buf=buf.slice(i+2);
      let ev='message',data='';
      for(const line of block.split('\n')){
        if(line.startsWith('event: '))ev=line.slice(7).trim();
        else if(line.startsWith('data: '))data+=line.slice(6);
      }
      if(!data)continue;
      let d;try{d=JSON.parse(data);}catch(e){continue;}
      if(ev==='meta'){
        meta=d;
        if(d.hits&&d.hits.length){
          const shown=d.hits.length;
          $('anssrc').innerHTML=`<div class="reslabel">${T('kaynaklar','sources')} (${T('en iyi','top')} ${shown} / ${d.total||shown})</div>`+
            (d.total>shown?`<div class="note" style="margin:-6px 0 10px 2px">${T(`Cevap yalnızca en alakalı ${shown} kaynağa dayanıyor — toplam ${d.total} eşleşmeden geri kalanı görmek için "Bul" moduna geçin (ya da yukarıdan ilgili kayıt sayısını artırın).`,`The answer is based only on the ${shown} most relevant sources — switch to "Find" mode to see the rest of the ${d.total} matches (or raise the related-record count above).`)}</div>`:'')+
            d.hits.map(srcCard).join('');
          applyCodeEnhancements($('anssrc'));
          // Kullanıcı isteği: aynı sorguda birden fazla aday fonksiyon bulunduysa
          // (örn. 5 farklı "Split" implementasyonu), isteğe bağlı bir düğmeyle
          // Stabilite/Performans karşılaştırma tablosu üretilebilsin.
          CMP_HITS=d.hits;
          if(d.hits.length>=2){
            $('cmpwrap').innerHTML=`<button type="button" class="cmp-btn" id="cmp-btn" onclick="compareFunctions()">📊 ${T('Stabilite/Performans Karşılaştırma Tablosu Oluştur','Generate Stability/Performance Comparison Table')}</button>`;
          }
        }
      }else if(ev==='error'){$('ans').innerHTML='⚠️ '+esc(d.error||JSON.stringify(d));}
      else if(ev==='step'){if(!text)$('ans').innerHTML=`<span class="spin"></span>${esc(d.step||'')}…`;}
      else if(ev==='done'){sec=d.sec??'?';truncated=!!d.truncated;}
      else if(d.t){text+=d.t;$('ans').innerHTML=citeFmt(text)+'<span class="spin"></span>';updateAnsToggle();}
    }
  }
  if(myRun!==RUN_SEQ)return;
  $('ans').innerHTML=text?citeFmt(text):$('ans').innerHTML.replace('<span class="spin"></span>','');
  if(text){CHAT_HISTORY.push({q,a:text});if(CHAT_HISTORY.length>8)CHAT_HISTORY.shift();persistChat();}
  // Sıra 4 (kullanıcı, ekran görüntüsüyle bulunan gerçek hata): "Derin"de cevap
  // yarım/eksik kalıyordu — num_predict artırıldı AMA her uzunluk için
  // yetmeyebilir; bu yüzden sunucunun bildirdiği gerçek kesilme durumu
  // (Ollama done_reason="length") burada AÇIKÇA gösteriliyor.
  const truncNote=truncated?`<div class="note" style="margin:8px 2px 0;color:var(--err)">⚠️ ${T('Cevap token sınırına takıldı — kesilmiş olabilir. Soruyu daraltmayı deneyin.','The answer hit the token limit — it may be truncated. Try narrowing the question.')}</div>`:'';
  $('ansmeta').innerHTML=`${esc((meta&&meta.model)||model)} · ${T('yanıt','answer')} ${sec}s · ${T('arama','search')} ${(meta&&meta.ms_search)||'?'}ms · ${MODE}${chatChip()}`+truncNote;
  updateAnsToggle();
}
// Sıra 7 (kullanıcı): id="ans" (derin/normal araştırma cevabı) büyüdükçe
// ekrana sığmıyordu — kod bloklarındaki (.codewrap) AYNI aç/kapa deseni
// (max-height + gradient fade), yalnız uzunsa düğme gösterilir.
// 2. tur (kullanıcı, ekran görüntüsü): düğme yazım BİTENE kadar hiç
// gözükmüyordu — artık her token geldiğinde de çağrılıyor (bkz. yukarıda
// d.t dalı). Bunun için noclamp KALICI olmamalı: kısayken eklenip metin
// büyüyünce geri kaldırılabilmeli, yoksa erken kısa halde takılıp sonunda
// uzun cevapta düğme hiç çıkmaz. "open" durumunda da düğme gizlenmemeli —
// kullanıcı yazım sırasında genişletirse "Daralt" ile geri kapatabilmeli.
function updateAnsToggle(){
  const el=$('ans'),btn=$('anstoggle');
  if(!el||!btn)return;
  const long=el.scrollHeight>360;
  if(el.classList.contains('open')){
    btn.style.display=long?'block':'none';
    btn.textContent=T('Daralt ▴','Collapse ▴');
    return;
  }
  if(long){
    el.classList.remove('noclamp');
    btn.style.display='block';
    btn.textContent=T('Devamını Göster ▾','Show more ▾');
  }else{
    el.classList.add('noclamp');
    btn.style.display='none';
  }
}
function togAns(){
  const el=$('ans');
  el.classList.toggle('open');
  void el.offsetHeight;   // Sıra 5 bulgusu: reflow zorlamadan transition bazen takılı kalıyor
  updateAnsToggle();
}
function err(m){return `<div class="answer" style="border-left-color:#c65">⚠️ ${esc(m)}</div>`;}
function none(){return `<div class="hero"><div class="mark">∅</div><p>${T('Sonuç bulunamadı — başka bir ifadeyle dene.','No results — try rephrasing.')}</p></div>`;}

// Stabilite/Performans karşılaştırma tablosu (kullanıcı isteği): cevap kutusunda
// gösterilen kaynaklardan (>=2) BÜYÜK modele TEK istekte puan istenir — gerçek
// ölçüm değil, kod okumaya dayalı LLM tahmini ("varsayım" — kullanıcının kendi
// tanımıyla). İsteğe bağlı: her sorguda otomatik ÇALIŞMAZ, düğmeyle tetiklenir.
function cmpScoreClass(n){return n>=8?'hi':(n>=5?'mid':'lo');}
function renderCompareTable(rows){
  const trs=rows.map(x=>{
    const st=Math.max(1,Math.min(10,+x.stability||0)), pf=Math.max(1,Math.min(10,+x.performance||0));
    // Kullanıcı isteği: tablodaki fonksiyon/dosya adına tıklayınca ilgili
    // kaynak kartına gidilsin, ayrıca oradan doğrudan "Tarayıcıda Göster"
    // yapılabilsin. Satır zaten CMP_HITS'teki 1 tabanlı sıraya (x.i) bağlı —
    // gereken koleksiyon/id/satır bilgisi orada hazır, ek istek gerekmez.
    const i=+x.i||0, h=CMP_HITS[i-1];
    const jump=(cls,txt)=>h?`<span class="${cls?cls+' ':''}cmp-jump" onclick="cmpJump(${i})" title="${T('Bu fonksiyonun kaynak kartına git','Go to this source card')}">${txt}</span>`
                           :(cls?`<span class="${cls}">${txt}</span>`:txt);
    const act=h?`<button type="button" class="cmp-act" onclick="cmpShowInBrowser(${i},this)" title="${T('Tarayıcıda Göster','Show in Browser')}">🌐</button>`:'';
    return `<tr><td>${i||''}</td><td class="cmp-name">${jump('',esc(x.name||''))}${act}`+
      `${x.unit?jump('cmp-src',esc(x.unit)+(x.collection?' · '+esc(x.collection):'')):''}</td>`+
      `<td class="cmp-score ${cmpScoreClass(st)}">${st}</td><td class="cmp-score ${cmpScoreClass(pf)}">${pf}</td>`+
      `<td class="cmp-reason">${esc(x.reason||'')}</td></tr>`;
  }).join('');
  return `<div class="reslabel">${T('Stabilite/Performans Karşılaştırma Tablosu','Stability/Performance Comparison Table')}</div>`+
    `<div class="cmp-wrap"><table class="cmp-table"><thead><tr><th>#</th><th>${T('Fonksiyon','Function')}</th>`+
    `<th>${T('Stabilite','Stability')}</th><th>${T('Performans','Performance')}</th><th>${T('Gerekçe','Reason')}</th></tr></thead>`+
    `<tbody>${trs}</tbody></table></div>`;
}
// Karşılaştırma tablosundan kaynak kartına atlama (kullanıcı isteği).
// i = CMP_HITS içindeki 1 tabanlı sıra; kart id'si srcCard'daki "s"+hit.id ile
// AYNI şemayı kullanır — tablo ile kartlar hep aynı hit listesinden çizildiği
// için başka bir eşleme tablosu tutmaya gerek yok.
function cmpJump(i){
  const h=CMP_HITS[i-1];if(!h)return;
  const card=$('s'+h.id);
  if(!card){   // kaynak kartları artık ekranda değilse tabloyu sessizce bırakma
    cmpShowInBrowser(i);return;
  }
  card.classList.add('open');
  void card.offsetHeight;   // aynı zorunlu reflow gerekçesi: bkz. tog()
  card.scrollIntoView({block:'center',behavior:'smooth'});
  card.classList.remove('cmp-flash');
  void card.offsetHeight;   // animasyonu yeniden tetiklemek için sınıfı sıfırla
  card.classList.add('cmp-flash');
  setTimeout(()=>card.classList.remove('cmp-flash'),1500);
}
// Tablodan doğrudan "Tarayıcıda Göster" — kaynak kartındaki düğmeyle AYNI
// showInBrowser çağrısı (satır hedefleme dahil), kartı bulmaya gerek kalmadan.
function cmpShowInBrowser(i,btn){
  const h=CMP_HITS[i-1];if(!h)return;
  const fake=btn||{innerHTML:'',disabled:false};   // düğmesiz çağrıda (cmpJump geri düşüşü) iskele
  showInBrowser(h.id,h.collection,fake,h.line_start||0,hljsLangFor(h.lang||inferLangFromUnit(h.unit)));
}
async function compareFunctions(){
  const btn=$('cmp-btn');if(!btn)return;
  // Karşılaştırma da uzun sürer (büyük model) ve tam olarak akış döngüsüyle AYNI
  // tuzağa düşüyordu: bu sırada yeni bir arama başlarsa #cmpwrap silinir ve
  // aşağıdaki yazım null'a çarpardı. Aynı sıra numarasıyla korunuyor.
  const myRun=RUN_SEQ;
  const orig=btn.innerHTML;btn.disabled=true;btn.innerHTML=`<span class="spin"></span>${T('Karşılaştırılıyor…','Comparing…')}`;
  try{
    const r=await(await fetch('/api/compare',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q:CMP_Q,hits:CMP_HITS,lang:LANG,ollama_url:localStorage.getItem('ci-ollama-url')||''})})).json();
    if(myRun!==RUN_SEQ)return;   // bayat: bu tablonun ait olduğu arama artık ekranda değil
    if(r.error){await ciError(r.error);btn.disabled=false;btn.innerHTML=orig;return;}
    // name/unit/collection modelin echo'suna HİÇ güvenmeden ASIL hit'ten alınır.
    // Canlı testte görüldü: model "name" alanına bazen dosya/satır bilgisini de
    // ekliyor (örn. "Split (mORMot/SynCommons.pas L3193)") — bu, meta_hits'teki
    // "(unit)" sonekiyle AYNI kökten gelen bir sorun; tek düzeltme model
    // çıktısını hiç kullanmamak, her zaman CMP_HITS'teki temiz isme dönmek.
    const rows=(r.rows||[]).map(x=>{
      const h=CMP_HITS[(+x.i||0)-1];
      return h?{...x,name:h.name,unit:h.unit,collection:h.collection}:x;
    });
    $('cmpwrap').innerHTML=renderCompareTable(rows);
  }catch(e){await ciError(e);btn.disabled=false;btn.innerHTML=orig;}
}

async function loadMore(){
  const btn=$('loadmore');btn.disabled=true;btn.innerHTML=`<span class="spin"></span>${T('yükleniyor…','loading…')}`;
  LAST_OFFSET+=PAGE_SIZE;
  try{
    const r=await(await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(searchBody(LAST_OFFSET))})).json();
    if(r.error){btn.remove();return;}
    ALL_HITS=ALL_HITS.concat(r.hits);
    // gruplama tam yeniden çizim gerektirir (yeni gelen sonuçlar var olan bir
    // gruba ait olabilir) — insertAdjacentHTML ile sona eklemek burada yanlış olurdu
    $('hitlist').innerHTML=renderHitList(ALL_HITS);
    applyCodeEnhancements();
    const shownNow=ALL_HITS.length;
    $('reslabel').textContent=`${shownNow} / ${r.total} ${T('sonuç gösteriliyor','results shown')} · ${r.ms} ms · ${MODE}`;
    if(r.has_more){btn.disabled=false;btn.innerHTML=T('Daha Fazla Göster','Show More')+' ▾';}
    else btn.remove();
  }catch(e){btn.disabled=false;btn.innerHTML=T('Daha Fazla Göster','Show More')+' ▾';}
}

async function explain(id,collection,depth,btn){
  btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='<span class="spin"></span>';
  $('s'+id).classList.add('open');
  try{
    const model=depth==='deep'?(localStorage.getItem('ci-mdeep')||''):(localStorage.getItem('ci-mfast')||'');  // bos = sunucu config'i kullansin
    const r=await(await fetch('/api/explain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection,id:+id,depth,model})})).json();
    const e=$('e'+id);e.textContent=r.text+(r.cached?'  📌':'');e.classList.add('has');
  }catch(x){await ciError(x);}
  btn.disabled=false;btn.innerHTML=old;
}

function relItem(it){return `<span class="rel-item" onclick="jumpTo('${escJs(it.name)}')">${esc(it.name)} <span class="u">${esc(it.unit||'')}${it.line_start?':'+it.line_start:''}</span></span>`;}
function relGroup(title,items){
  if(!items||!items.length)return `<div class="rel-group"><h4>${title}</h4><div class="rel-empty">${T('yok','none')}</div></div>`;
  return `<div class="rel-group"><h4>${title} (${items.length})</h4>${items.map(relItem).join('')}</div>`;
}
function jumpTo(name){$('q').value=name;document.querySelector('[data-a="find"]').click();run();}

async function showRelations(id,collection,btn,kind,name){
  const box=$('r'+id);
  const wasOpen=box.classList.contains('has');
  if(wasOpen){box.classList.remove('has');return;}
  $('s'+id).classList.add('open');
  const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>'+T('yükleniyor…','loading…');
  try{
    const r=await(await fetch('/api/relations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection,id:+id})})).json();
    if(r.error){box.innerHTML=err(r.error);}
    else{
      box.innerHTML=relGroup(T('Bunu çağıranlar','Called by'),r.called_by)+
                     relGroup(T('Bunun çağırdıkları','Calls'),r.calls)+
                     relGroup(T('Aynı dosyadaki diğerleri','Same file'),r.same_unit);
    }
    // tip chunk'ları için kalıtım hiyerarşisi de göster (sembol grafiğinden)
    if(kind==='type'&&name){
      try{
        const h=await(await fetch('/api/mcp/get_type_hierarchy',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({collection,type_name:name})})).json();
        const anc=(h.ancestors||[]).map(a=>({name:a.name+(a.in_corpus===false?' ⌁':''),unit:''}));
        const desc=(h.descendants||[]).map(d=>({name:d.name,unit:d.unit||''}));
        if(anc.length||desc.length){
          box.innerHTML+=relGroup(T('Üst sınıflar','Ancestors'),anc)+relGroup(T('Alt sınıflar','Descendants'),desc);
        }
      }catch(e){}
    }
    box.classList.add('has');
  }catch(x){box.innerHTML=err(String(x));box.classList.add('has');}
  btn.disabled=false;btn.innerHTML=old;
}

async function reveal(id,collection,mode,btn){
  const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  try{
    const r=await(await fetch('/api/reveal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection,id:+id,mode})})).json();
    if(r.error)await ciError(r.error);
  }catch(x){await ciError(x);}
  btn.disabled=false;btn.innerHTML=old;
}

let SP_CONTENT='';
// Sıra 1, 2. tur (kullanıcı): sağ panel de highlight.js kullanmalı. Sorun:
// hljs TÜM dosyayı TEK HTML string'i olarak tokenize ediyor; çok satırlı bir
// token (ör. /* ... \n ... */ yorumu) '\n' ile NAİF bölünürse <span> etiketi
// bir satırda AÇIK kalır, HTML bozulur. Aşağıdaki splitHighlightedHtmlByLines
// bunu doğru yapar: '\n'e her rastladığında o an AÇIK olan <span>'leri kapatıp
// satırı bitirir, sonraki satırın BAŞINDA AYNI etiketleri yeniden açar (kod
// editörlerinin kullandığı standart teknik) — hljs çıktısı yalnız <span
// class="..."> kullandığı için etiket adını izlemek gerekmez, YALNIZ '<span'
// mi '</span>' mi diye bakmak yeterli.
function splitHighlightedHtmlByLines(html){
  const openTags=[];
  const lines=[];
  let current='';
  let i=0;
  while(i<html.length){
    if(html[i]==='<'){
      const close=html.indexOf('>',i);
      if(close===-1){current+=html.slice(i);break;}
      const tag=html.slice(i,close+1);
      if(tag.slice(0,2)==='</')openTags.pop();
      else if(tag.slice(0,5)==='<span')openTags.push(tag);
      current+=tag;
      i=close+1;
    }else if(html[i]==='\n'){
      lines.push(current+'</span>'.repeat(openTags.length));
      current=openTags.join('');
      i++;
    }else{
      current+=html[i];
      i++;
    }
  }
  lines.push(current);
  return lines;
}
function renderLinesWithTarget(codeEl,html,targetLine){
  codeEl.innerHTML=splitHighlightedHtmlByLines(html).map((line,i)=>{
    const n=i+1,isTarget=n===targetLine;
    return `<span data-ln="${n}"${isTarget?' id="hl-target" class="hlline"':''}>${line||' '}</span>`;
  }).join('');
}
function hlApplyLineTargeted(codeEl,hljsLang,targetLine){
  const raw=codeEl.textContent;
  if(!hljsLang||typeof hljs==='undefined'){renderLinesWithTarget(codeEl,esc(raw),targetLine);return;}
  const finish=()=>{
    try{renderLinesWithTarget(codeEl,hljs.highlight(raw,{language:hljsLang}).value,targetLine);}
    catch(e){renderLinesWithTarget(codeEl,esc(raw),targetLine);}
  };
  if(HLJS_LOADED[hljsLang]==='ok'){finish();return;}
  if(HLJS_LOADED[hljsLang]==='error'){renderLinesWithTarget(codeEl,esc(raw),targetLine);return;}
  const s=document.createElement('script');
  s.src='/static/vendor/highlightjs/languages/'+hljsLang+'.min.js';
  s.onload=()=>{HLJS_LOADED[hljsLang]='ok';finish();};
  s.onerror=()=>{HLJS_LOADED[hljsLang]='error';renderLinesWithTarget(codeEl,esc(raw),targetLine);};
  document.head.appendChild(s);
}
async function showInBrowser(id,collection,btn,lineStart,hljsLang){
  const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  try{
    const r=await(await fetch('/api/reveal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection,id:+id,mode:'browser'})})).json();
    if(r.error){
      $('sp-fname').textContent=T('Hata','Error');
      $('sp-body').innerHTML=`<div class="sp-err">⚠️ ${esc(r.error)}</div>`;
      SP_CONTENT='';
    }else{
      $('sp-fname').textContent=(r.name||r.path)+(lineStart?` · L${lineStart}`:'');
      $('sp-body').innerHTML='<pre><code></code></pre>';
      const codeEl=document.querySelector('#sp-body code');
      codeEl.textContent=r.content;
      hlApplyLineTargeted(codeEl,hljsLang,lineStart);
      SP_CONTENT=r.content;
      if(lineStart){
        // requestAnimationFrame'e BAĞIMLI DEĞİL — arka plandaki/görünmeyen
        // sekmelerde rAF askıya alınabiliyor (canlı testte doğrulandı: panel
        // kompozit edilmeden rAF hiç tetiklenmiyordu). scrollIntoView düzen
        // hesaplaması için boyanmaya/kompozisyona ihtiyaç duymaz, senkron
        // çağrı yeterli ve daha güvenilir.
        const el=document.getElementById('hl-target');
        if(el)el.scrollIntoView({block:'center'});
      }
    }
    $('sidepanel').classList.add('show');
  }catch(x){await ciError(x);}
  btn.disabled=false;btn.innerHTML=old;
}
function closeSidePanel(){
  $('sidepanel').classList.remove('show');
}
async function copySidePanel(){
  if(!SP_CONTENT)return;
  try{
    await navigator.clipboard.writeText(SP_CONTENT);
    const btn=$('sp-copy');const old=btn.textContent;btn.textContent='✅';
    setTimeout(()=>btn.textContent=old,1200);
  }catch(e){}
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('sidepanel').classList.contains('show')){closeSidePanel();return;}
  if(e.key==='/'&&document.activeElement!==$('q')&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault();$('q').focus();
  }
});

// Sağ panel sola doğru genişletilebilir (sürükle-bırak) — uzun satırlı kodlar
// varsayılan genişliğe sığmıyordu. Genişlik oturumlar arası hatırlanır.
(function(){
  const panel=$('sidepanel'), handle=$('sp-resize');
  const saved=parseInt(localStorage.getItem('ci-spwidth'));
  if(saved)panel.style.width=saved+'px';
  let dragging=false;
  handle.addEventListener('mousedown',e=>{dragging=true;panel.classList.add('dragging');handle.classList.add('dragging');e.preventDefault();});
  window.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const w=Math.min(window.innerWidth*0.95,Math.max(340,window.innerWidth-e.clientX));
    panel.style.width=w+'px';
  });
  window.addEventListener('mouseup',()=>{
    if(!dragging)return;
    dragging=false;panel.classList.remove('dragging');handle.classList.remove('dragging');
    localStorage.setItem('ci-spwidth',parseInt(panel.style.width));
  });
})();
$('q').focus();
</script>
