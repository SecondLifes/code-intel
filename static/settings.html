<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code-Intel — Ayarlar</title>
<style>
:root{--bg:#0b0e14;--panel:#131722;--card:#1a1f2e;--line:#252b3b;--txt:#e6e9f0;--dim:#8b93a7;--acc:#5b8cff;--acc2:#22c58b;--err:#ef5b6b;--mono:'Cascadia Code',Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.6 'Segoe UI',system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;font-weight:600}
header h1 b{color:var(--acc)}
.sp{flex:1}
a.back{color:var(--dim);text-decoration:none;font-size:13.5px}
a.back:hover{color:var(--txt)}
.lang{cursor:pointer;user-select:none;font-size:12.5px;color:var(--dim)}
.lang b{color:var(--txt)}
main{max-width:860px;margin:0 auto;padding:26px 20px 80px}
.panelcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.panelcard h3{font-size:12.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label{font-size:12px;color:var(--dim);display:block;margin:0 0 4px 3px}
.field{display:flex;flex-direction:column;margin-bottom:10px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--txt);font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
button{background:var(--acc);border:0;border-radius:10px;color:#fff;padding:11px 22px;font-size:14px;cursor:pointer;font-weight:600}
button:disabled{opacity:.5;cursor:wait}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin-right:6px}
.pill.ok{color:var(--acc2);border-color:#1b4536}
.pill.bad{color:var(--err);border-color:#552731}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--dim);text-align:left;font-weight:500;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
td.mono{font-family:var(--mono);color:var(--acc)}
.jobbar{display:none;margin-top:14px}
.jobbar.show{display:block}
.bar{height:9px;background:#0d1117;border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0%;transition:width .5s}
.jobmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--dim);border-top-color:var(--acc);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.note{font-size:12px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>⚙️ Code-<b>Intel</b> <span id="t-settings" style="color:var(--dim);font-weight:400">Ayarlar</span></h1>
  <div class="sp"></div>
  <span class="lang" onclick="toggleLang()"><b id="lang-now">TR</b> / <span id="lang-alt">EN</span></span>
  <a class="back" href="/" id="t-back">← Sohbete dön</a>
</header>
<main>
  <!-- SAĞLIK -->
  <div class="panelcard">
    <h3 id="t-health">Sistem Durumu</h3>
    <span id="p-qdrant" class="pill">Qdrant</span>
    <span id="p-ollama" class="pill">Ollama</span>
    <span id="p-gpu" class="pill">GPU</span>
  </div>

  <!-- YENİ İNDEKSLEME -->
  <div class="panelcard">
    <h3 id="t-index">Yeni İndeksleme</h3>
    <div class="field">
      <label id="l-path">Kaynak klasör (boş = mevcut chunk dosyasını yeniden kullan)</label>
      <input id="idx-path" placeholder="E:\system\dev\...\Source">
    </div>
    <div class="row">
      <div class="field"><label id="l-name">İndeks adı</label><input id="idx-coll" value="unidac" style="width:160px"></div>
      <div class="field"><label id="l-type">İndeks türü</label>
        <select id="idx-mode">
          <option value="hybrid">Hibrit — önerilen</option>
          <option value="dense">Anlamsal (dense)</option>
          <option value="sparse">Kelime (BM25)</option>
        </select></div>
      <div class="field"><label id="l-dev">Donanım</label>
        <select id="idx-dev"><option value="gpu">GPU (RTX 5080)</option><option value="cpu">CPU</option></select></div>
      <div class="field"><button onclick="startIndex()" id="btn-index">İndekslemeyi Başlat</button></div>
    </div>
    <div class="note" id="t-note">Var olan aynı adlı indeks silinip yeniden oluşturulur. Kelime (BM25) modu GPU gerektirmez ve çok hızlıdır.</div>
    <div class="jobbar" id="jobbar">
      <div style="font-size:13.5px" id="jobtitle">…</div>
      <div class="bar"><div id="jobfill"></div></div>
      <div class="jobmeta"><span id="jobnums"></span><span id="jobrate"></span><span id="jobeta"></span></div>
    </div>
  </div>

  <!-- MODELLER -->
  <div class="panelcard">
    <h3 id="t-models">Ollama Modelleri (Türkçe açıklama)</h3>
    <div class="row">
      <div class="field"><label>⚡ <span id="l-fast">Hızlı model</span></label><select id="m-fast" style="min-width:220px"></select></div>
      <div class="field"><label>🔬 <span id="l-deep">Derin model</span></label><select id="m-deep" style="min-width:220px"></select></div>
    </div>
  </div>

  <!-- KOLEKSİYONLAR -->
  <div class="panelcard">
    <h3 id="t-colls">İndeksler</h3>
    <table><thead><tr><th id="th-name">Ad</th><th id="th-pts">Nokta</th></tr></thead><tbody id="coll-rows"></tbody></table>
  </div>
</main>
<script>
let LANG=localStorage.getItem('ci-lang')||'tr';
const T=(tr,en)=>LANG==='tr'?tr:en, $=id=>document.getElementById(id);
function applyLang(){
  $('lang-now').textContent=LANG.toUpperCase();$('lang-alt').textContent=LANG==='tr'?'EN':'TR';
  $('t-settings').textContent=T('Ayarlar','Settings');$('t-back').textContent=T('← Sohbete dön','← Back to chat');
  $('t-health').textContent=T('Sistem Durumu','System Health');$('t-index').textContent=T('Yeni İndeksleme','New Indexing');
  $('l-path').textContent=T('Kaynak klasör (boş = mevcut chunk dosyasını yeniden kullan)','Source folder (empty = reuse existing chunks)');
  $('l-name').textContent=T('İndeks adı','Index name');$('l-type').textContent=T('İndeks türü','Index type');$('l-dev').textContent=T('Donanım','Device');
  $('btn-index').textContent=T('İndekslemeyi Başlat','Start Indexing');
  $('t-note').textContent=T('Var olan aynı adlı indeks silinip yeniden oluşturulur. Kelime (BM25) modu GPU gerektirmez ve çok hızlıdır.','An existing index with the same name is recreated. Keyword (BM25) mode needs no GPU and is very fast.');
  $('t-models').textContent=T('Ollama Modelleri (Türkçe açıklama)','Ollama Models (explanations)');
  $('l-fast').textContent=T('Hızlı model','Fast model');$('l-deep').textContent=T('Derin model','Deep model');
  $('t-colls').textContent=T('İndeksler','Indexes');$('th-name').textContent=T('Ad','Name');$('th-pts').textContent=T('Nokta','Points');
  const im=$('idx-mode');im.options[0].text=T('Hibrit — önerilen','Hybrid — recommended');im.options[1].text=T('Anlamsal (dense)','Semantic (dense)');im.options[2].text=T('Kelime (BM25)','Keyword (BM25)');
}
function toggleLang(){LANG=LANG==='tr'?'en':'tr';localStorage.setItem('ci-lang',LANG);applyLang();}
applyLang();
function setPill(id,ok,label){const el=$(id);el.className='pill '+(ok?'ok':'bad');el.textContent=(ok?'● ':'○ ')+label;}
async function health(){try{
  const h=await(await fetch('/api/health')).json();
  setPill('p-qdrant',h.qdrant,'Qdrant');setPill('p-ollama',h.ollama,'Ollama');setPill('p-gpu',h.gpu,'GPU');
  $('coll-rows').innerHTML=(h.collections||[]).map(c=>`<tr><td class="mono">${c.name}</td><td>${c.points.toLocaleString('tr')}</td></tr>`).join('');
}catch(e){}}
async function loadModels(){try{
  const d=await(await fetch('/api/ollama/models')).json();
  for(const [sel,def,key] of [['m-fast','gemma4','ci-mfast'],['m-deep','qwen3.6','ci-mdeep']]){
    const s=$(sel);s.innerHTML=(d.models||[]).map(m=>`<option>${m}</option>`).join('');
    const saved=localStorage.getItem(key);
    const want=(saved&&d.models.includes(saved))?saved:(d.models.find(m=>m.startsWith(def))||d.models[0]||'');
    if(want)s.value=want;s.onchange=()=>localStorage.setItem(key,s.value);
  }
}catch(e){}}
health();loadModels();setInterval(health,10000);

let jobTimer=null;
function esc(s){return (s||'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function startIndex(){
  const body={path:$('idx-path').value.trim(),collection:$('idx-coll').value.trim()||'unidac',mode:$('idx-mode').value,device:$('idx-dev').value};
  const r=await(await fetch('/api/index/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  if(r.error){alert(r.error);return;}
  $('jobbar').classList.add('show');if(jobTimer)clearInterval(jobTimer);jobTimer=setInterval(poll,1500);poll();
}
async function poll(){
  const s=await(await fetch('/api/index/status')).json();
  if(s.phase==='idle'||!s.phase)return;
  $('jobbar').classList.add('show');
  if(!jobTimer&&s.phase!=='done'&&s.phase!=='error')jobTimer=setInterval(poll,1500);
  const pct=s.total?Math.round(100*s.done/s.total):0;
  $('jobfill').style.width=pct+'%';
  $('jobnums').textContent=s.phase==='chunking'?T('Kod ayrıştırılıyor…','Parsing code…'):`${(s.done||0).toLocaleString('tr')} / ${(s.total||0).toLocaleString('tr')} (${pct}%)`;
  $('jobrate').textContent=(s.rate?s.rate+' chunk/sn':'')+(s.device?` · ${s.device.toUpperCase()}`:'')+(s.mode?` · ${s.mode}`:'');
  $('jobeta').textContent=s.rate&&s.total?T('kalan ','ETA ')+Math.max(0,Math.round((s.total-s.done)/s.rate))+' sn':'';
  $('jobtitle').innerHTML=s.phase==='done'?'✅ '+T('Tamamlandı','Done')+` (${s.sec} sn)`:s.phase==='error'?'❌ '+esc(s.error):'<span class="spin"></span>'+T('İndeksleniyor','Indexing')+` — ${esc(s.collection||'')}`;
  if(s.phase==='done'||s.phase==='error'){clearInterval(jobTimer);jobTimer=null;health();}
}
poll();
</script>
</body>
</html>
